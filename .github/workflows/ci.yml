name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Everything except browser tests: seconds, and the only job a push to `main` runs.
  # Railway's "Wait for CI" waits for every job, so the slow browser job is skipped on push;
  # `main` accepts only commits from a pull request, which has already run it.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -m "not browser" -v

  # Playwright tests (tests marked `browser` by tests/conftest.py), on pull requests only, in parallel shards:
  # each job asks `tools.browser_shards` for its own share of the test files (same dealing on every job, so
  # together they run every file once). `browser` below is the one check name to require in branch protection.
  browser-shards:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    strategy:
      # A failing shard must not hide what the others found.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      # A missing Chromium fails the job instead of skipping every test.
      REQUIRE_CHROMIUM: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Chromium system libraries
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run browser tests (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        run: |
          shard_files=$(python -m tools.browser_shards --shards ${{ strategy.job-total }} --index ${{ matrix.shard }})
          echo "shard ${{ matrix.shard }}: $shard_files"
          pytest $shard_files -m browser -v

  # One stable check for the shards, whatever their number.
  browser:
    if: always() && github.event_name != 'push'
    needs: browser-shards
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: test "${{ needs.browser-shards.result }}" = "success"
